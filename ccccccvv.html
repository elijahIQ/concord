let currentQuestion = 0;
let missedAnswers = [];

// Load question
function loadQuestion(){
  document.getElementById("passage").innerText = questions[currentQuestion];
  document.getElementById("questionNumber").innerText = `Question ${currentQuestion+1} of ${questions.length}`;
  document.getElementById("answer").value = "";
  document.getElementById("result").innerHTML = "";
  document.getElementById("answerBox").style.display = "none";
  document.getElementById("showBtn").disabled = true;
}

// Check Answer
function checkAnswer(){
  const userText = document.getElementById("answer").value.toLowerCase();
  const currentCorrections = expectedCorrections[currentQuestion];
  let correctCount = 0;
  missedAnswers = [];

  currentCorrections.forEach(item=>{
    if(item.pattern.test(userText)){ // ✅ check pattern
      correctCount++;
    } else {
      missedAnswers.push(item.text);
    }
  });

  const percentScore = Math.round((correctCount / currentCorrections.length) * 100);

  let msg = percentScore >= 70
    ? "✅ Excellent! Correct subject–verb agreement detected."
    : percentScore >= 40
    ? "⚠️ Fair attempt. Some corrections missing or incorrect."
    : "❌ Poor attempt. Review subject–verb agreement rules.";

  document.getElementById("result").innerHTML = 
    `Score: ${percentScore}% (${correctCount} of ${currentCorrections.length} correct)<br>${msg}`;
  document.getElementById("showBtn").disabled = false;
}

// Show missed answers
function showAnswers(){
  const box = document.getElementById("answerBox");
  if(missedAnswers.length===0){
    box.innerHTML = "🎉 All answers were correct!";
  } else {
    box.innerHTML = "<strong>Correct answers you missed:</strong><br><ol>" +
      missedAnswers.map(a=>`<li>${a}</li>`).join("") + "</ol>";
  }
  box.style.display = "block";
}

// Navigation
function nextQuestion(){if(currentQuestion<questions.length-1){currentQuestion++;loadQuestion();}}
function prevQuestion(){if(currentQuestion>0){currentQuestion--;loadQuestion();}}

// Initial load
loadQuestion();
